name: medv2-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medv2}
      POSTGRES_USER: ${POSTGRES_USER:-medv2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medv2_local_password}
    ports:
      - "127.0.0.1:${MEDV2_POSTGRES_PORT:-5437}:5432"
    volumes:
      - medv2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medv2-local:latest
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      MEDV2_CONTAINER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medv2}:${POSTGRES_PASSWORD:-medv2_local_password}@db:5432/${POSTGRES_DB:-medv2}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-a-long-random-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL_DOCKER:-http://127.0.0.1:3011}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-180000}
    ports:
      - "127.0.0.1:${MEDV2_DOCKER_PORT:-3011}:3000"
    volumes:
      - medv2_data:/app/data
      - medv2_uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  medv2_postgres:
  medv2_data:
  medv2_uploads:
